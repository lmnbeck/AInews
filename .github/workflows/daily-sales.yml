name: Daily Sales Data Update
on:
  schedule:
    - cron: '0 2 * * *'  # UTC 2:00 = Beijing 10:00
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run scraper
        run: node scripts/scrape-sales.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "Auto Sales Bot"
          git config user.email "bot@autonews.com"
          git add public/data/sales.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update sales data [daily]" && git push)
